services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lions
      MYSQL_USER: lions_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.prod}
    volumes:
      - lions_mysql_data:/var/lib/mysql
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: lions-app:production
    restart: unless-stopped
    env_file:
      - .env.app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://lions.devicesperu.com
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: lions
      DB_USERNAME: lions_user
      SESSION_SECURE_COOKIE: "true"
      LOG_LEVEL: warning
    volumes:
      - lions_app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_internal
      - app_egress

  queue:
    image: lions-app:production
    restart: unless-stopped
    env_file:
      - .env.app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://lions.devicesperu.com
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: lions
      DB_USERNAME: lions_user
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - lions_app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - app_internal
      - app_egress

  public-sync:
    image: lions-app:production
    profiles: ["deploy"]
    entrypoint: ["sh", "-lc"]
    command: ["cp -a /var/www/html/public/. /shared/ && ln -sfn ../../storage/app/public /shared/storage"]
    volumes:
      - lions_public:/shared

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - lions_public:/var/www/html/public:ro
      - lions_app_storage:/var/www/html/storage:ro
      - /opt/nginx-proxy/html:/usr/share/nginx/html:ro
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    environment:
      VIRTUAL_HOST: lions.devicesperu.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: lions.devicesperu.com
    networks:
      - app_internal
      - asistencia_asistencia-net

networks:
  app_internal:
    internal: true
  app_egress:
    driver: bridge
  asistencia_asistencia-net:
    external: true

volumes:
  lions_mysql_data:
  lions_app_storage:
  lions_public:
